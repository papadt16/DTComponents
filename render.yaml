# Render "Blueprint": New + > Blueprint > pick your GitHub repo.
services:
  - type: web
    name: desk-robot-brain
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: GROQ_API_KEY
        sync: false          # you type these in the Render dashboard, never in the file
      - key: GEMINI_API_KEY
        sync: false          # optional backup
      - key: DEVICE_TOKENS
        sync: false
